name: JMA weather alerts to Slack

on:
  schedule:
    # Hourly, 10:00-19:00 JST only (JST = UTC+9, so JST 10:00-19:00 is UTC
    # 01:00-10:00). GitHub Actions cron is always UTC, hence the shifted
    # hours below -- "0 1-10 * * *" fires once on the hour for UTC hours
    # 1 through 10 inclusive, i.e. JST 10,11,...,19.
    # Note: GitHub may delay scheduled runs by a few minutes under load --
    # this is a GitHub Actions limitation, not something this workflow can
    # control.
    - cron: "0 1-10 * * *"
  workflow_dispatch: {} # lets you trigger a run manually any time from the Actions tab, regardless of the schedule window above

# Avoid two overlapping runs racing to commit state/seen.json.
concurrency:
  group: weather-alerts
  cancel-in-progress: false

permissions:
  contents: write # needed to commit the updated state/seen.json back to the repo

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run JMA -> Slack poll
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py

      - name: Commit updated state (only if it changed)
        run: |
          if git diff --quiet -- state/seen.json; then
            echo "state/seen.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "chore: update notified-warning state [skip ci]"
          git push

name: JMA weather alerts to Slack

on:
  schedule:
    # Every 15 minutes. GitHub Actions cron runs in UTC; this has no
    # dependency on timezone since it's a fixed interval, not a time of day.
    # Note: GitHub may delay scheduled runs by a few minutes under load --
    # this is a GitHub Actions limitation, not something this workflow can
    # control.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

# Avoid two overlapping runs racing to commit state/seen.json.
concurrency:
  group: weather-alerts
  cancel-in-progress: false

permissions:
  contents: write # needed to commit the updated state/seen.json back to the repo

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run JMA -> Slack poll
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py

      - name: Commit updated state (only if it changed)
        run: |
          if git diff --quiet -- state/seen.json; then
            echo "state/seen.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "chore: update notified-warning state [skip ci]"
          git push
